<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВетДневник - Добавить питомца</title>
    <style>
        :root {
            --primary-color: #20B2AA;
            --bg-color: #F4F7F6;
            --text-color: #333;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            /* Чтобы модалка не прокручивала фон */
            overflow: hidden;
        }

        /* --- Базовые стили дашборда для фона --- */
        .sidebar { width: 250px; background-color: var(--card-bg); padding: 20px; box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; filter: blur(2px); }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); margin-bottom: 40px; }
        .main-content { flex: 1; padding: 30px; filter: blur(2px); }
        
        /* --- Окно модальное (Overlay) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            color: var(--text-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            padding: 25px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #FFF;
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* Загрузка фото */
        .photo-upload {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #FAFAFA;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .photo-upload:hover {
            border-color: var(--primary-color);
            background-color: rgba(32, 178, 170, 0.05);
        }

        .photo-icon {
            font-size: 32px;
            color: #CCC;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 14px;
            color: #666;
        }

        .upload-text span {
            color: var(--primary-color);
            font-weight: 600;
        }

        .modal-footer {
            padding: 15px 25px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background-color: #FAFAFA;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #CCC;
            color: #555;
        }

        .btn-outline:hover {
            background-color: #F0F0F0;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #179891;
        }
    </style>
</head>

<body>

    <!-- Размытый фон дашборда для реалистичности -->
    <div class="sidebar">
        <div class="logo">🐾 ВетДневник</div>
    </div>
    <div class="main-content">
        <h1>Дашборд</h1>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Добавление питомца</h2>
                <button class="close-btn" aria-label="Закрыть модальное окно">&times;</button>
            </div>
            
            <div class="modal-body">
                <form id="add-pet-form">
                    <!-- Загрузка фото -->
                    <div class="photo-upload">
                        <div class="photo-icon">📷</div>
                        <div class="upload-text"><span>Нажмите для загрузки</span> или перетащите фото</div>
                        <input type="file" style="display: none;" id="pet-photo" accept="image/*">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="pet-name">Кличка *</label>
                            <input type="text" id="pet-name" class="form-control" placeholder="Например, Барсик" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="pet-species">Вид животного *</label>
                            <select id="pet-species" class="form-control" required>
                                <option value="" disabled selected>Выберите вид</option>
                                <option value="dog">Собака</option>
                                <option value="cat">Кошка</option>
                                <option value="bird">Птица</option>
                                <option value="rodent">Грызун</option>
                                <option value="reptile">Рептилия</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="pet-breed">Порода</label>
                            <input type="text" id="pet-breed" class="form-control" placeholder="Например, Корги">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="pet-weight">Вес (кг)</label>
                            <input type="number" id="pet-weight" class="form-control" step="0.1" placeholder="0.0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="pet-dob">Дата рождения</label>
                        <input type="date" id="pet-dob" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="pet-health">Особенности здоровья (аллергии, хроника)</label>
                        <textarea id="pet-health" class="form-control" placeholder="Укажите важную информацию для ветеринара..."></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="window.history.back()">Отмена</button>
                <button type="submit" form="add-pet-form" class="btn btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

</body>

</html>
